[package]
name = "protasena"
description = "Protasena schematic capture, the desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true
# egui 0.36 needs Rust 1.95
rust-version = "1.95"
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
protasena-engine.workspace = true
protasena-io.workspace = true
protasena-ui-egui.workspace = true
# The same eframe features as AsenaCAD's desktop app (wgpu renderer, accesskit, Wayland and X11).
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "links"] }
egui.workspace = true
rfd.workspace = true
serde_json.workspace = true

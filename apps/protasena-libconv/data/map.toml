# Single symbols with a Proteus-style device name (and a PRIMITIVE property for the plain
# passives). Further fields override the rules above.
[devices]
# `default_package` is a conventional through-hole package for each common part (the device's
# PACKAGE property); `pin_map` maps pins to pads when the pin numbers are not pad numbers.
# Devices without one take the symbol's Footprint field, else their first through-hole link,
# else their first link (rule: apps/protasena-libconv/src/link.rs).
"Device:R" = { name = "RES", primitive = "ANALOG", default_package = "R_Axial_DIN0207_L6.3mm_D2.5mm_P10.16mm_Horizontal" }
"Device:C" = { name = "CAP", primitive = "ANALOG", default_package = "C_Disc_D5.0mm_W2.5mm_P5.00mm" }
"Device:C_Polarized" = { name = "CAP-ELEC", primitive = "ANALOG", default_package = "CP_Radial_D5.0mm_P2.00mm" }
"Device:L" = { name = "INDUCTOR", primitive = "ANALOG", default_package = "L_Axial_L5.3mm_D2.2mm_P10.16mm_Horizontal_Vishay_IM-1" }
"Device:D" = { name = "DIODE", default_package = "D_DO-41_SOD81_P10.16mm_Horizontal" }
"Device:LED" = { name = "LED", default_package = "LED_D5.0mm" }
# TO-92 pads 1-2-3 as emitter-base-collector (the 2N3904 / 2N3906 pinout).
"Device:Q_NPN" = { name = "NPN", default_package = "TO-92_Inline", pin_map = { E = "1", B = "2", C = "3" } }
"Device:Q_PNP" = { name = "PNP", default_package = "TO-92_Inline", pin_map = { E = "1", B = "2", C = "3" } }
"Device:Battery" = { name = "BATTERY", default_package = "PinHeader_1x02_P2.54mm_Vertical" }
"Device:Crystal" = { name = "CRYSTAL", default_package = "Crystal_HC49-U_Vertical" }
"Device:Fuse" = { name = "FUSE", default_package = "Fuseholder_Cylinder-5x20mm_Stelvio-Kontek_PTF78_Horizontal_Open" }
"Device:Lamp" = { name = "LAMP" }
"Device:Speaker" = { name = "SPEAKER", default_package = "PinHeader_1x02_P2.54mm_Vertical" }
"Device:Buzzer" = { name = "BUZZER", default_package = "Buzzer_12x9.5RM7.6" }
"Switch:SW_Push" = { name = "BUTTON", default_package = "SW_PUSH_6mm" }
"Switch:SW_SPST" = { name = "SWITCH", default_package = "SW_DIP_SPSTx01_Slide_9.78x4.72mm_W7.62mm_P2.54mm" }
"power:GND" = { name = "GROUND" }
"power:VCC" = { name = "POWER" }
"74xx:74LS00" = { name = "74LS00", default_package = "DIP-14_W7.62mm" }
"4xxx:4001" = { name = "4001", default_package = "DIP-14_W7.62mm" }
"Amplifier_Operational:LM358" = { default_package = "DIP-8_W7.62mm" }
"Amplifier_Operational:LM741" = { default_package = "DIP-8_W7.62mm" }
"Amplifier_Operational:TL071" = { default_package = "DIP-8_W7.62mm" }
"Amplifier_Operational:TL072" = { default_package = "DIP-8_W7.62mm" }
"Amplifier_Operational:NE5532" = { default_package = "DIP-8_W7.62mm" }
"Amplifier_Operational:OP07" = { default_package = "DIP-8_W7.62mm" }
"Amplifier_Operational:LM324" = { default_package = "DIP-14_W7.62mm" }

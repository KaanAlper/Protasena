# protasena-libconv map: KiCad libraries and symbols → Pick Devices names, categories and
# manufacturers. Written by the Protasena contributors (MIT OR Apache-2.0); it holds no KiCad
# or Proteus data, only our own classification of KiCad's library names.
#
# Lookup order for a symbol: [devices] entry, then the first matching [[rules]] entry, then its
# [libraries] entry, then a name derived from the library (`Foo_Bar` → "Foo" / "Bar"; such
# libraries are listed as unmapped in the report). Category names follow the Pick Devices
# style; where no such category fits we use our own plain names.

# A `_`-separated word of a library name → manufacturer of its parts.
[manufacturers]
Altera = "Altera"
AnalogDevices = "Analog Devices"
CologneChip = "Cologne Chip"
Cypress = "Cypress"
Dialog = "Dialog Semiconductor"
Efinix = "Efinix"
Espressif = "Espressif"
Freescale = "Freescale"
Intel = "Intel"
Lattice = "Lattice"
Microchip = "Microchip"
Microsemi = "Microsemi"
Motorola = "Motorola"
Nordic = "Nordic Semiconductor"
NXP = "NXP"
Parallax = "Parallax"
Puya = "Puya"
RaspberryPi = "Raspberry Pi"
Renesas = "Renesas"
SiFive = "SiFive"
SiliconLabs = "Silicon Labs"
ST = "STMicroelectronics"
STC = "STC"
Texas = "Texas Instruments"

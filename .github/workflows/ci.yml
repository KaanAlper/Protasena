# The quality gate on every supported desktop OS: `cargo xtask ci` (fmt --check, clippy
# -D warnings, tests, layers, assets). Third-party actions are pinned to commit SHAs.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: cargo xtask ci (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust (stable, rustfmt, clippy)
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version
          cargo --version
      - name: Dependencies (Cargo.lock must be up to date)
        run: cargo fetch --locked
      - name: cargo xtask ci
        run: cargo xtask ci
